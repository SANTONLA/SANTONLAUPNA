<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hello World Interactivo</title>
    <style>
        :root{
            --bg1: #0f172a;
            --bg2: #0b1220;
            --card: rgba(255,255,255,0.06);
            --accent: #7c3aed;
            --accent2: #06b6d4;
            --text: #e6eef8;
        }
        [data-theme="light"]{
            --bg1: #f6f8ff;
            --bg2: #eef2ff;
            --card: rgba(8,8,20,0.04);
            --accent: #6d28d9;
            --accent2: #0891b2;
            --text: #0b1220;
        }

        html,body{
            height:100%;
            margin:0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: radial-gradient(1200px 600px at 10% 20%, rgba(124,58,237,0.12), transparent),
                                    radial-gradient(1000px 500px at 90% 80%, rgba(6,182,212,0.08), transparent),
                                    linear-gradient(135deg,var(--bg1),var(--bg2));
            color:var(--text);
            -webkit-font-smoothing:antialiased;
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        /* subtle cursor glow */
        body::before{
            content:"";
            pointer-events:none;
            position:fixed;
            inset:0;
            background:
                radial-gradient(600px circle at var(--mouse-x) var(--mouse-y), rgba(124,58,237,0.10), transparent 10%),
                radial-gradient(400px circle at calc(var(--mouse-x) + 10%) calc(var(--mouse-y) - 5%), rgba(6,182,212,0.06), transparent 12%);
            mix-blend-mode: overlay;
            transition: background 120ms linear;
        }

        .wrap{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:48px;
            box-sizing:border-box;
        }

        .card{
            width:960px;
            max-width:100%;
            background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
            border-radius:18px;
            padding:36px;
            box-shadow: 0 10px 30px rgba(2,6,23,0.6);
            backdrop-filter: blur(8px) saturate(120%);
            border: 1px solid rgba(255,255,255,0.04);
            display:flex;
            gap:24px;
            align-items:center;
            justify-content:space-between;
            flex-wrap:wrap;
        }

        .left{
            flex:1 1 480px;
            min-width:260px;
        }

        .title{
            font-size: clamp(34px, 6vw, 64px);
            font-weight:800;
            letter-spacing:-0.02em;
            margin:0 0 12px 0;
            display:flex;
            flex-wrap:wrap;
            gap:6px;
        }

        .title .char{
            display:inline-block;
            transform-origin:50% 80%;
            animation: floatIn 800ms cubic-bezier(.2,.9,.3,1) both;
            filter: drop-shadow(0 8px 20px rgba(12,12,30,0.5));
        }

        @keyframes floatIn{
            from{ transform: translateY(30px) rotateX(20deg) scale(.98); opacity:0; }
            to  { transform: translateY(0)    rotateX(0)    scale(1);   opacity:1; }
        }

        .subtitle{
            margin:6px 0 18px 0;
            color:rgba(255,255,255,0.75);
            font-size:15px;
        }

        .controls{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            align-items:center;
        }

        .btn{
            background:linear-gradient(90deg,var(--accent),var(--accent2));
            color:white;
            border:0;
            padding:10px 16px;
            border-radius:10px;
            cursor:pointer;
            font-weight:600;
            box-shadow: 0 6px 18px rgba(7,10,25,0.35);
            transition:transform .12s ease,opacity .12s ease;
        }
        .btn:active{ transform:translateY(1px) scale(.995); }
        .btn.alt{
            background:transparent;
            color:var(--text);
            border:1px solid rgba(255,255,255,0.08);
            box-shadow:none;
        }

        .right{
            width:320px;
            max-width:100%;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:12px;
        }

        .preview {
            width:100%;
            aspect-ratio:1.3/1;
            border-radius:12px;
            background: linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            display:flex;
            align-items:center;
            justify-content:center;
            color:var(--text);
            font-weight:700;
            font-size:20px;
            border:1px solid rgba(255,255,255,0.03);
            box-shadow: inset 0 -6px 24px rgba(0,0,0,0.2);
            position:relative;
            overflow:hidden;
        }

        .pulse{
            position:absolute;
            width:120%;
            height:120%;
            left:-10%;
            top:-10%;
            background: conic-gradient(from 200deg,var(--accent),var(--accent2), rgba(124,58,237,0.0));
            opacity:0.06;
            transform: rotate(0deg);
            animation: spin 12s linear infinite;
            pointer-events:none;
        }
        @keyframes spin{ to{ transform: rotate(360deg); } }

        /* confetti pieces */
        .confetti{
            position:fixed;
            pointer-events:none;
            z-index:9999;
            will-change: transform, opacity;
            width:10px;
            height:14px;
            opacity:0.95;
            transform-origin:center;
            border-radius:2px;
        }

        footer.note{
            font-size:12px;
            color:rgba(255,255,255,0.62);
            margin-top:6px;
        }

        /* small responsive */
        @media (max-width:760px){
            .card{ padding:20px; gap:14px; }
            .right{ order:-1; width:100%; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card" id="card">
            <div class="left">
                <h1 class="title" id="title">Hello, World!</h1>
                <p class="subtitle" id="subtitle">Un saludo interactivo — pasa el ratón, haz clic y cambia el texto.</p>

                <div class="controls">
                    <button class="btn" id="btn-change">Cambiar texto</button>
                    <button class="btn alt" id="btn-theme">Alternar tema</button>
                    <button class="btn alt" id="btn-confetti">Confetti</button>
                </div>
                <div class="note" style="margin-top:14px">
                    <span class="note">Haz clic en el área para lanzar confetti. Mueve el ratón para ver el resplandor.</span>
                </div>
            </div>

            <div class="right">
                <div class="preview" id="preview">
                    <div class="pulse"></div>
                    <div id="preview-text">¡Interactúa!</div>
                </div>
                <div class="footer note">Diseño ligero — HTML · CSS · JavaScript</div>
            </div>
        </div>
    </div>

    <script>
        // animar cada letra con delay
        const titleEl = document.getElementById('title');
        function setTitleText(text){
            titleEl.innerHTML = '';
            [...text].forEach((ch,i)=>{
                const span = document.createElement('span');
                span.className = 'char';
                span.textContent = ch;
                span.style.animationDelay = (i * 45) + 'ms';
                // tiny hover pop
                span.onmouseenter = ()=> span.animate([{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-6px) scale(1.06)' }, { transform: 'translateY(0) scale(1)' }], { duration:350, easing:'cubic-bezier(.2,.9,.3,1)' });
                titleEl.appendChild(span);
            });
        }
        setTitleText('Hello, World!');

        // theme toggle
        const btnTheme = document.getElementById('btn-theme');
        btnTheme.addEventListener('click', ()=>{
            const root = document.documentElement;
            if(root.getAttribute('data-theme') === 'light') root.removeAttribute('data-theme');
            else root.setAttribute('data-theme','light');
        });

        // change text
        const btnChange = document.getElementById('btn-change');
        btnChange.addEventListener('click', ()=>{
            const newText = prompt('Escribe el nuevo saludo:', '¡Hola, Mundo!');
            if(newText !== null){
                setTitleText(newText || 'Hello, World!');
                document.getElementById('preview-text').textContent = newText || '¡Interactúa!';
            }
        });

        // confetti generator
        function launchConfetti(x = window.innerWidth/2, y = window.innerHeight/2, count = 28){
            const colors = ['#fb7185','#f97316','#facc15','#34d399','#60a5fa','#a78bfa'];
            for(let i=0;i<count;i++){
                const el = document.createElement('div');
                el.className = 'confetti';
                el.style.background = colors[Math.floor(Math.random()*colors.length)];
                el.style.left = (x - 6 + (Math.random()*40-20)) + 'px';
                el.style.top  = (y - 6 + (Math.random()*40-20)) + 'px';
                el.style.transform = `rotate(${Math.random()*360}deg)`;
                document.body.appendChild(el);

                const vx = (Math.random()*6-3);
                const vy = - (Math.random()*8 + 6);
                const rot = (Math.random()*720-360);
                const life = 1200 + Math.random()*800;

                const start = performance.now();
                function frame(now){
                    const t = now - start;
                    const progress = t / life;
                    if(progress >= 1){
                        el.remove();
                        return;
                    }
                    // gravity
                    const dx = vx * t/16;
                    const dy = vy * t/16 + 0.5 * 0.6 * (t/16)*(t/16);
                    el.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot * progress}deg)`;
                    el.style.opacity = String(1 - progress);
                    requestAnimationFrame(frame);
                }
                requestAnimationFrame(frame);
            }
        }

        // confetti button
        document.getElementById('btn-confetti').addEventListener('click', (e)=>{
            launchConfetti(window.innerWidth/2, window.innerHeight/2, 48);
        });

        // also launch confetti when clicking the preview
        const preview = document.getElementById('preview');
        preview.addEventListener('click', (e)=>{
            launchConfetti(e.clientX, e.clientY, 34);
        });

        // follow mouse for radial glow
        window.addEventListener('mousemove', (e)=>{
            const px = (e.clientX / window.innerWidth) * 100;
            const py = (e.clientY / window.innerHeight) * 100;
            document.documentElement.style.setProperty('--mouse-x', px + '%');
            document.documentElement.style.setProperty('--mouse-y', py + '%');
        });

        // small interaction: press H to reset message
        window.addEventListener('keydown', (e)=>{
            if(e.key.toLowerCase() === 'h'){
                setTitleText('Hello, World!');
                document.getElementById('preview-text').textContent = '¡Interactúa!';
                launchConfetti(window.innerWidth/2, window.innerHeight/2, 36);
            }
        });

        // accessibility: click anywhere in card to highlight a random letter
        document.getElementById('card').addEventListener('click', (ev)=>{
            const chars = titleEl.querySelectorAll('.char');
            if(chars.length){
                const idx = Math.floor(Math.random() * chars.length);
                const letter = chars[idx];
                letter.animate([
                    { transform: 'scale(1) translateY(0)', filter:'brightness(1)' },
                    { transform: 'scale(1.32) translateY(-8px)', filter:'brightness(1.2)' },
                    { transform: 'scale(1) translateY(0)', filter:'brightness(1)' },
                ], { duration:520, easing:'cubic-bezier(.2,.9,.3,1)' });
            }
        });
    </script>
</body>
</html></div>
